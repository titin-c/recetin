name: CI

on:
  push:
    branches: [main, "fase-*"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recetin
          POSTGRES_PASSWORD: recetin
          POSTGRES_DB: recetin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recetin" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://recetin:recetin@localhost:5432/recetin_ci
      DIRECT_URL: postgresql://recetin:recetin@localhost:5432/recetin_ci
      DATABASE_URL_TEST: postgresql://recetin:recetin@localhost:5432/recetin_test
      BETTER_AUTH_SECRET: ci-solo-para-tests-0123456789abcdef0123456789
      APP_URL: http://localhost:3000
      EMAIL_DRIVER: console
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:int:prepare
      - run: pnpm test:int
      - run: pnpm build
